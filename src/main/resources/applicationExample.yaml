server:
  port: 8080
  servlet:
    context-path: /api/v1/loyalty

spring:
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
        one-indexed-parameters: false
  application:
    name: loyalty.service

  datasource:
    url: jdbc:postgresql://localhost:5432/aman_loyalty
    username: DB_USERNAME
    password: DB_PASSWORD
    driver-class-name: org.postgresql.Driver

  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      mode: always

  jackson:
    default-property-inclusion: non_null


loyalty:
  rules:
    default-lock-days: 30
    default-expiry-days: 360
    default-earning-rate: 1.00   # 1 EGP = 1 point
    default-redemption-rate: 0.005 # 1 point = 0.005 EGP

  conversion:
    conversionOfMoney: 1
    rateOfPoint: 0.005

  otp:
    length: 6
    ttl-seconds: 120
    max-attempts: 3

  security:
    secret-key: "1234567890123456"

logging:
  level:
    com.aman.loyalty: DEBUG
    org.hibernate.SQL: DEBUG

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  show-actuator: false