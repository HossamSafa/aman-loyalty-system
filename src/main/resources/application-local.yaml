spring:
  application:
    name: loyalty

  datasource:
    url: jdbc:postgresql://localhost:5432/loyalty_db
    username: postgres
    password: 1234
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8088

management:
  endpoints:
    web:
      exposure:
        include: health,info

loyalty:
  conversion:
    conversionOfMoney: 1
    rateOfPoint: 0.005
    logging:
      level:
        org.hibernate.orm.jdbc.bind: TRACE